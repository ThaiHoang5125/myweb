<!DOCTYPE html>
<html lang="vi" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Thái Hoàng — Portfolio</title>
  <meta name="description" content="Web cá nhân của Thái Hoàng: giới thiệu bản thân và các dự án app cá nhân.">
  <meta property="og:title" content="Thái Hoàng — Portfolio">
  <meta property="og:description" content="Giới thiệu bản thân và các dự án app cá nhân.">
  <meta property="og:type" content="website">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="bg-orbs" aria-hidden="true"><span></span><span></span><span></span></div>

  <header class="nav">
    <a href="#home" class="logo">TH<span>.</span></a>
    <nav class="nav-links">
      <a href="#about" data-i18n="nav.about"></a>
      <a href="#projects" data-i18n="nav.projects"></a>
      <a href="#contact" data-i18n="nav.contact"></a>
    </nav>
    <div class="nav-tools">
      <button id="langBtn" class="tool-btn" aria-label="Change language">EN</button>
      <button id="themeBtn" class="tool-btn" aria-label="Toggle theme">☾</button>
    </div>
  </header>

  <main>
    <section id="home" class="hero">
      <p class="hero-hi reveal" data-i18n="hero.hi"></p>
      <h1 class="reveal">Thái Hoàng</h1>
      <h2 class="reveal"><span id="typed"></span><span class="cursor">|</span></h2>
      <p class="hero-sub reveal" data-i18n="hero.sub"></p>
      <div class="hero-cta reveal">
        <a href="#projects" class="btn btn-primary" data-i18n="hero.cta1"></a>
        <a href="#contact" class="btn btn-ghost" data-i18n="hero.cta2"></a>
      </div>
    </section>

    <section id="about" class="section">
      <h2 class="section-title reveal" data-i18n="about.title"></h2>
      <div class="about-grid">
        <div class="avatar reveal"><span>TH</span></div>
        <div class="about-text reveal">
          <p data-i18n="about.p1"></p>
          <p data-i18n="about.p2"></p>
          <h3 data-i18n="about.skills"></h3>
          <ul class="chips" id="skills"></ul>
        </div>
      </div>
    </section>

    <section id="projects" class="section">
      <h2 class="section-title reveal" data-i18n="projects.title"></h2>
      <div class="filters reveal">
        <div class="filter-btns" id="filterBtns">
          <button data-filter="all" class="active" data-i18n="filter.all"></button>
          <button data-filter="web" data-i18n="filter.web"></button>
          <button data-filter="windows" data-i18n="filter.windows"></button>
        </div>
        <input type="search" id="searchBox" data-i18n-ph="projects.search">
      </div>
      <div class="project-grid" id="projectGrid"></div>
    </section>

    <section id="contact" class="section">
      <h2 class="section-title reveal" data-i18n="contact.title"></h2>
      <p class="reveal contact-intro" data-i18n="contact.intro"></p>
      <form class="contact-form reveal" id="contactForm">
        <input type="text" id="cName" required data-i18n-ph="contact.name">
        <input type="email" id="cEmail" required data-i18n-ph="contact.email">
        <textarea id="cMsg" rows="5" required data-i18n-ph="contact.msg"></textarea>
        <button type="submit" class="btn btn-primary" data-i18n="contact.send"></button>
      </form>
      <ul class="socials reveal">
        <li><a href="mailto:hoangluuanthai.work@gmail.com">Email</a></li>
        <li><a href="https://github.com/ThaiHoang5125" target="_blank" rel="noopener">GitHub</a></li>
      </ul>
    </section>
  </main>

  <footer class="footer">© <span id="year"></span> Thái Hoàng</footer>

  <script src="data/projects.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
